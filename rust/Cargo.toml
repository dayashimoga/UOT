[package]
name = "rust_lib_uot_app"
version = "0.1.0"
edition = "2021"
description = "Universal Offline Transfer - Core Engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
hex = "0.4"
async-trait = "0.1"
mdns-sd = "0.12"
bytes = "1"
crc32fast = "1"
hostname = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
parking_lot = "0.12"
flume = "0.11"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
