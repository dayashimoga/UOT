# Docker Compose — Multi-Device E2E Test Network
#
# Creates an isolated bridge network with 2 UOT nodes (sender + receiver)
# that discover each other and perform real file transfers.

services:
  # Node A — Sender
  uot-sender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uot-sender
    hostname: uot-sender
    networks:
      uot-bridge:
        ipv4_address: 172.28.0.10
    environment:
      - UOT_DEVICE_NAME=SenderNode
      - UOT_NETWORK_PORT=42000
      - RUST_LOG=info
    command: >
      cargo test --manifest-path rust/Cargo.toml
      --test e2e_transfer
      --test load_stress
      -- --nocapture --test-threads=1
    volumes:
      - sender-data:/app/transfer_data

  # Node B — Receiver
  uot-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uot-receiver
    hostname: uot-receiver
    networks:
      uot-bridge:
        ipv4_address: 172.28.0.11
    environment:
      - UOT_DEVICE_NAME=ReceiverNode
      - UOT_NETWORK_PORT=42000
      - RUST_LOG=info
    command: >
      cargo test --manifest-path rust/Cargo.toml
      --test integration_transfer
      -- --nocapture --test-threads=1
    volumes:
      - receiver-data:/app/transfer_data
    depends_on:
      - uot-sender

  # Full test suite runner
  uot-test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uot-test-runner
    hostname: uot-test-runner
    networks:
      uot-bridge:
        ipv4_address: 172.28.0.12
    environment:
      - UOT_DEVICE_NAME=TestRunner
      - RUST_LOG=info
    command: >
      cargo test --manifest-path rust/Cargo.toml
      --verbose -- --nocapture --test-threads=2
    profiles:
      - full

networks:
  uot-bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  sender-data:
  receiver-data:
