version: '3.8'

services:
  node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.peer
    container_name: uot-lab-node-a
    hostname: uot-node-a
    networks:
      uot-lab-net:
        ipv4_address: 172.28.0.10
    cap_add:
      - NET_ADMIN
    environment:
      - UOT_NODE_ID=node-a
      - UOT_PEER_ADDR=172.28.0.20:4242

  node-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.peer
    container_name: uot-lab-node-b
    hostname: uot-node-b
    networks:
      uot-lab-net:
        ipv4_address: 172.28.0.20
    cap_add:
      - NET_ADMIN
    environment:
      - UOT_NODE_ID=node-b
      - UOT_PEER_ADDR=172.28.0.10:4242

  node-c:
    build:
      context: ..
      dockerfile: docker/Dockerfile.peer
    container_name: uot-lab-node-c
    hostname: uot-node-c
    networks:
      uot-lab-net:
        ipv4_address: 172.28.0.30
    cap_add:
      - NET_ADMIN
    environment:
      - UOT_NODE_ID=node-c
      - UOT_PEER_ADDR=172.28.0.10:4242

networks:
  uot-lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
